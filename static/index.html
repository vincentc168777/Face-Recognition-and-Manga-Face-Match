<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manga Face Match</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    h1 { margin-bottom: 5px; }
    p.subtitle { color: #666; margin-top: 0; }
    #upload-box {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 30px;
      margin: 20px 0;
    }
    #preview {
      max-width: 200px;
      max-height: 200px;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }
    button {
      background: #4a4ae0;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #results {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    .match-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px;
      width: 160px;
    }
    .match-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      background: #f5f5f5;
    }
    .match-card .emotion {
      font-weight: bold;
      margin-top: 8px;
      text-transform: capitalize;
    }
    .match-card .score {
      color: #888;
      font-size: 13px;
    }
    #status { margin-top: 15px; color: #666; }
    #error { color: #c0392b; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Manga Face Match</h1>
  <p class="subtitle">Upload a photo — find the manga expression that matches your face</p>

  <div id="upload-box">
    <input type="file" id="file-input" accept="image/jpeg,image/png" />
    <br />
    <img id="preview" alt="preview" />
    <br />
    <button id="submit-btn" disabled>Find My Match</button>
  </div>

  <div id="status"></div>
  <div id="error"></div>
  <div id="results"></div>

  <script>
    const fileInput = document.getElementById("file-input");
    const preview = document.getElementById("preview");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const resultsEl = document.getElementById("results");

    let selectedFile = null;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "inline-block";
      submitBtn.disabled = false;
      errorEl.textContent = "";
      resultsEl.innerHTML = "";
    });

    submitBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      statusEl.textContent = "Analyzing your expression...";
      errorEl.textContent = "";
      resultsEl.innerHTML = "";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const res = await fetch("/match?top_k=1", {
          method: "POST",
          body: formData,
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || `Request failed (${res.status})`);
        }

        const data = await res.json();
        statusEl.textContent = "";
        renderResults(data.matches);
      } catch (err) {
        statusEl.textContent = "";
        errorEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    function renderResults(matches) {
      resultsEl.innerHTML = "";
      matches.forEach((m) => {
        const card = document.createElement("div");
        card.className = "match-card";

        const img = document.createElement("img");
        img.src = `/panels/${m.filename}`;
        img.alt = m.emotion;

        const emotion = document.createElement("div");
        emotion.className = "emotion";
        emotion.textContent = m.emotion;

        const score = document.createElement("div");
        score.className = "score";
        score.textContent = `${(m.similarity * 100).toFixed(1)}% match`;

        card.appendChild(img);
        card.appendChild(emotion);
        card.appendChild(score);
        resultsEl.appendChild(card);
      });
    }
  </script>
</body>
</html>
